<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">CIM17Parser Flow Diagram</text>
  
  <!-- Main flow -->
  <!-- Start node -->
  <circle cx="500" cy="80" r="25" fill="#4caf50" stroke="#388e3c" stroke-width="2"/>
  <text x="500" y="85" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Start</text>
  
  <!-- Initialize Cim17Parser -->
  <rect x="400" y="130" width="200" height="50" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="10" ry="10"/>
  <text x="500" y="160" font-family="Arial" font-size="14" text-anchor="middle">Initialize Cim17Parser</text>
  
  <!-- Decision node: Parse file or content? -->
  <polygon points="500,200 550,250 500,300 450,250" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="500" y="255" font-family="Arial" font-size="12" text-anchor="middle">File or Content?</text>
  
  <!-- Parse File -->
  <rect x="250" y="280" width="160" height="50" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="10" ry="10"/>
  <text x="330" y="310" font-family="Arial" font-size="14" text-anchor="middle">Parse File</text>
  
  <!-- Parse Content -->
  <rect x="600" y="280" width="160" height="50" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="10" ry="10"/>
  <text x="680" y="310" font-family="Arial" font-size="14" text-anchor="middle">Parse Content</text>
  
  <!-- XmlHandler loadFile -->
  <rect x="250" y="360" width="160" height="50" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="5" ry="5"/>
  <text x="330" y="390" font-family="Arial" font-size="14" text-anchor="middle">XmlHandler.loadFile</text>
  
  <!-- XmlHandler loadContent -->
  <rect x="600" y="360" width="160" height="50" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="5" ry="5"/>
  <text x="680" y="390" font-family="Arial" font-size="14" text-anchor="middle">XmlHandler.loadContent</text>
  
  <!-- Decision node: loading successful? -->
  <polygon points="330,440 380,490 330,540 280,490" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="330" y="495" font-family="Arial" font-size="12" text-anchor="middle">Load successful?</text>
  
  <polygon points="680,440 730,490 680,540 630,490" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="680" y="495" font-family="Arial" font-size="12" text-anchor="middle">Load successful?</text>
  
  <!-- Error paths -->
  <rect x="180" y="550" width="160" height="50" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" rx="5" ry="5"/>
  <text x="260" y="580" font-family="Arial" font-size="14" text-anchor="middle">Set Error Message</text>
  
  <rect x="530" y="550" width="160" height="50" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" rx="5" ry="5"/>
  <text x="610" y="580" font-family="Arial" font-size="14" text-anchor="middle">Set Error Message</text>
  
  <!-- Return false nodes -->
  <rect x="180" y="630" width="160" height="50" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" rx="5" ry="5"/>
  <text x="260" y="660" font-family="Arial" font-size="14" text-anchor="middle">Return false</text>
  
  <rect x="530" y="630" width="160" height="50" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" rx="5" ry="5"/>
  <text x="610" y="660" font-family="Arial" font-size="14" text-anchor="middle">Return false</text>
  
  <!-- Success path continues -->
  <rect x="400" y="450" width="200" height="50" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="10" ry="10"/>
  <text x="500" y="480" font-family="Arial" font-size="14" text-anchor="middle">Determine CGMES Profile</text>
  
  <rect x="400" y="530" width="200" height="50" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="10" ry="10"/>
  <text x="500" y="560" font-family="Arial" font-size="14" text-anchor="middle">Process CIM Document</text>
  
  <!-- Decision node: processing successful? -->
  <polygon points="500,610 550,660 500,710 450,660" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="500" y="665" font-family="Arial" font-size="12" text-anchor="middle">Processing successful?</text>
  
  <!-- Error path -->
  <rect x="600" y="700" width="160" height="50" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" rx="5" ry="5"/>
  <text x="680" y="730" font-family="Arial" font-size="14" text-anchor="middle">Set Error Message</text>
  
  <rect x="600" y="760" width="160" height="50" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" rx="5" ry="5"/>
  <text x="680" y="790" font-family="Arial" font-size="14" text-anchor="middle">Return false</text>
  
  <!-- Success end node -->
  <rect x="250" y="700" width="160" height="50" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="10" ry="10"/>
  <text x="330" y="730" font-family="Arial" font-size="14" text-anchor="middle">Return true</text>
  
  <circle cx="330" cy="790" r="25" fill="#4caf50" stroke="#388e3c" stroke-width="2"/>
  <text x="330" y="795" font-family="Arial" font-size="14" text-anchor="middle" fill="white">End</text>
  
  <!-- Connecting lines -->
  <!-- Start to Initialize -->
  <line x1="500" y1="105" x2="500" y2="130" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="500,130 496,122 504,122" fill="#5c5c5c"/>
  
  <!-- Initialize to Decision -->
  <line x1="500" y1="180" x2="500" y2="200" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="500,200 496,192 504,192" fill="#5c5c5c"/>
  
  <!-- Decision to Parse File -->
  <line x1="450" y1="250" x2="370" y2="280" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="370,280 372,271 379,276" fill="#5c5c5c"/>
  <text x="380" y="255" font-family="Arial" font-size="12" fill="#5c5c5c">File</text>
  
  <!-- Decision to Parse Content -->
  <line x1="550" y1="250" x2="640" y2="280" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="640,280 633,276 635,271" fill="#5c5c5c"/>
  <text x="620" y="255" font-family="Arial" font-size="12" fill="#5c5c5c">Content</text>
  
  <!-- Parse File to XmlHandler -->
  <line x1="330" y1="330" x2="330" y2="360" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="330,360 326,352 334,352" fill="#5c5c5c"/>
  
  <!-- Parse Content to XmlHandler -->
  <line x1="680" y1="330" x2="680" y2="360" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="680,360 676,352 684,352" fill="#5c5c5c"/>
  
  <!-- XmlHandler to Decision -->
  <line x1="330" y1="410" x2="330" y2="440" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="330,440 326,432 334,432" fill="#5c5c5c"/>
  
  <line x1="680" y1="410" x2="680" y2="440" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="680,440 676,432 684,432" fill="#5c5c5c"/>
  
  <!-- Decision to Error -->
  <line x1="280" y1="490" x2="260" y2="550" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="260,550 258,541 267,545" fill="#5c5c5c"/>
  <text x="250" y="520" font-family="Arial" font-size="12" fill="#5c5c5c">No</text>
  
  <line x1="630" y1="490" x2="610" y2="550" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="610,550 608,541 617,545" fill="#5c5c5c"/>
  <text x="600" y="520" font-family="Arial" font-size="12" fill="#5c5c5c">No</text>
  
  <!-- Error to Return false -->
  <line x1="260" y1="600" x2="260" y2="630" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="260,630 256,622 264,622" fill="#5c5c5c"/>
  
  <line x1="610" y1="600" x2="610" y2="630" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="610,630 606,622 614,622" fill="#5c5c5c"/>
  
  <!-- Decision to Success path -->
  <line x1="380" y1="490" x2="440" y2="475" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="440,475 432,478 435,470" fill="#5c5c5c"/>
  <text x="400" y="470" font-family="Arial" font-size="12" fill="#5c5c5c">Yes</text>
  
  <line x1="630" y1="490" x2="560" y2="475" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="560,475 565,470 568,478" fill="#5c5c5c"/>
  <text x="580" y="470" font-family="Arial" font-size="12" fill="#5c5c5c">Yes</text>
  
  <!-- Process steps -->
  <line x1="500" y1="500" x2="500" y2="530" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="500,530 496,522 504,522" fill="#5c5c5c"/>
  
  <!-- Process to Decision -->
  <line x1="500" y1="580" x2="500" y2="610" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="500,610 496,602 504,602" fill="#5c5c5c"/>
  
  <!-- Decision to Success and Error paths -->
  <line x1="450" y1="660" x2="350" y2="700" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="350,700 357,696 356,705" fill="#5c5c5c"/>
  <text x="380" y="670" font-family="Arial" font-size="12" fill="#5c5c5c">Yes</text>
  
  <line x1="550" y1="660" x2="650" y2="700" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="650,700 644,696 643,705" fill="#5c5c5c"/>
  <text x="600" y="670" font-family="Arial" font-size="12" fill="#5c5c5c">No</text>
  
  <!-- Error to Return false -->
  <line x1="680" y1="750" x2="680" y2="760" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="680,760 676,752 684,752" fill="#5c5c5c"/>
  
  <!-- Success to End -->
  <line x1="330" y1="750" x2="330" y2="765" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="330,765 326,757 334,757" fill="#5c5c5c"/>
  
  <!-- Process CIM Document Sub-process -->
  <rect x="750" y="360" width="200" height="300" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" rx="10" ry="10" stroke-dasharray="10,5"/>
  <text x="850" y="385" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">processCimDocument()</text>
  
  <rect x="770" y="410" width="160" height="40" fill="#e1bee7" stroke="#8e24aa" stroke-width="2" rx="5" ry="5"/>
  <text x="850" y="435" font-family="Arial" font-size="12" text-anchor="middle">Create CimRdfParser</text>
  
  <rect x="770" y="470" width="160" height="40" fill="#e1bee7" stroke="#8e24aa" stroke-width="2" rx="5" ry="5"/>
  <text x="850" y="495" font-family="Arial" font-size="12" text-anchor="middle">Parse RDF Document</text>
  
  <polygon points="850,530 900,560 850,590 800,560" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="850" y="565" font-family="Arial" font-size="10" text-anchor="middle">Parsing successful?</text>
  
  <rect x="770" y="600" width="160" height="40" fill="#ffccbc" stroke="#e64a19" stroke-width="2" rx="5" ry="5"/>
  <text x="850" y="625" font-family="Arial" font-size="12" text-anchor="middle">Return false</text>
  
  <!-- Connecting sub-process -->
  <line x1="850" y1="450" x2="850" y2="470" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="850,470 846,462 854,462" fill="#5c5c5c"/>
  
  <line x1="850" y1="510" x2="850" y2="530" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="850,530 846,522 854,522" fill="#5c5c5c"/>
  
  <line x1="850" y1="590" x2="850" y2="600" stroke="#5c5c5c" stroke-width="2"/>
  <polygon points="850,600 846,592 854,592" fill="#5c5c5c"/>
  <text x="835" y="595" font-family="Arial" font-size="10" fill="#5c5c5c">No</text>
  
  <!-- Legend -->
  <rect x="100" y="730" width="20" height="20" fill="#bbdefb" stroke="#1976d2" stroke-width="2" rx="5" ry="5"/>
  <text x="130" y="745" font-family="Arial" font-size="12">Main Process</text>
  
  <rect x="100" y="760" width="20" height="20" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" rx="5" ry="5"/>
  <text x="130" y="775" font-family="Arial" font-size="12">XML Handling</text>
  
  <polygon points="100,790 120,790 110,810" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="130" y="805" font-family="Arial" font-size="12">Decision</text>
  
  <rect x="100" y="820" width="20" height="20" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2" rx="5" ry="5"/>
  <text x="130" y="835" font-family="Arial" font-size="12">Error Handling</text>
</svg>