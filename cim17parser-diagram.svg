<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="30" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">CIM17Parser UML Class Diagram</text>
  
  <!-- Cim17Parser -->
  <rect x="470" y="60" width="260" height="180" fill="#e1f5fe" stroke="#0288d1" stroke-width="2" rx="5" ry="5"/>
  <line x1="470" y1="90" x2="730" y2="90" stroke="#0288d1" stroke-width="2"/>
  <line x1="470" y1="160" x2="730" y2="160" stroke="#0288d1" stroke-width="2"/>
  <text x="600" y="80" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Cim17Parser</text>
  <text x="480" y="110" font-family="Arial" font-size="12">- xmlHandler_: std::unique_ptr&lt;XmlHandler&gt;</text>
  <text x="480" y="130" font-family="Arial" font-size="12">- model_: CimModel</text>
  <text x="480" y="145" font-family="Arial" font-size="12">- profile_: CgmesProfile</text>
  <text x="480" y="180" font-family="Arial" font-size="12">+ parseFile(filePath: string): bool</text>
  <text x="480" y="195" font-family="Arial" font-size="12">+ parseContent(xmlContent: string): bool</text>
  <text x="480" y="210" font-family="Arial" font-size="12">+ getModel(): CimModel&</text>
  <text x="480" y="225" font-family="Arial" font-size="12">+ getProfile(): CgmesProfile</text>
  
  <!-- XmlHandler -->
  <rect x="100" y="280" width="250" height="160" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5" ry="5"/>
  <line x1="100" y1="310" x2="350" y2="310" stroke="#388e3c" stroke-width="2"/>
  <line x1="100" y1="370" x2="350" y2="370" stroke="#388e3c" stroke-width="2"/>
  <text x="225" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">XmlHandler</text>
  <text x="110" y="330" font-family="Arial" font-size="12">- xmlDoc_: std::unique_ptr&lt;pugi::xml_document&gt;</text>
  <text x="110" y="345" font-family="Arial" font-size="12">- validateXml_: bool</text>
  <text x="110" y="360" font-family="Arial" font-size="12">- namespaces_: std::unordered_map&lt;string, string&gt;</text>
  <text x="110" y="390" font-family="Arial" font-size="12">+ loadFile(filePath: string): bool</text>
  <text x="110" y="405" font-family="Arial" font-size="12">+ loadContent(content: string): bool</text>
  <text x="110" y="420" font-family="Arial" font-size="12">+ getRootNode(): pugi::xml_node</text>
  <text x="110" y="435" font-family="Arial" font-size="12">+ getModelProfiles(): vector&lt;string&gt;</text>
  
  <!-- CimRdfParser -->
  <rect x="100" y="500" width="250" height="160" fill="#ffecb3" stroke="#ffa000" stroke-width="2" rx="5" ry="5"/>
  <line x1="100" y1="530" x2="350" y2="530" stroke="#ffa000" stroke-width="2"/>
  <line x1="100" y1="590" x2="350" y2="590" stroke="#ffa000" stroke-width="2"/>
  <text x="225" y="520" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CimRdfParser</text>
  <text x="110" y="550" font-family="Arial" font-size="12">- model_: CimModel&amp;</text>
  <text x="110" y="565" font-family="Arial" font-size="12">- lastError_: string</text>
  <text x="110" y="580" font-family="Arial" font-size="12">- factories_: map&lt;string, ObjectFactory&gt;</text>
  <text x="110" y="610" font-family="Arial" font-size="12">+ parse(xmlHandler: XmlHandler): bool</text>
  <text x="110" y="625" font-family="Arial" font-size="12">+ getLastError(): string</text>
  <text x="110" y="640" font-family="Arial" font-size="12">- processRdfDescription(node: xml_node): bool</text>
  <text x="110" y="655" font-family="Arial" font-size="12">- processEquipment(...): bool</text>
  
  <!-- CgmesProfile -->
  <rect x="400" y="500" width="250" height="120" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" rx="5" ry="5"/>
  <line x1="400" y1="530" x2="650" y2="530" stroke="#8e24aa" stroke-width="2"/>
  <text x="525" y="520" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CgmesProfileInfo</text>
  <text x="410" y="550" font-family="Arial" font-size="12">+ toString(profile: CgmesProfile): string</text>
  <text x="410" y="565" font-family="Arial" font-size="12">+ fromString(profileStr: string): CgmesProfile</text>
  <text x="410" y="580" font-family="Arial" font-size="12">+ getNamespaceUri(profile: CgmesProfile): string</text>
  <text x="410" y="595" font-family="Arial" font-size="12">+ detectProfile(uri: string): CgmesProfile</text>
  <text x="410" y="610" font-family="Arial" font-size="12">+ getAllProfiles(): vector&lt;CgmesProfile&gt;</text>
  
  <!-- CimModel -->
  <rect x="700" y="280" width="350" height="180" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="5" ry="5"/>
  <line x1="700" y1="310" x2="1050" y2="310" stroke="#fbc02d" stroke-width="2"/>
  <line x1="700" y1="380" x2="1050" y2="380" stroke="#fbc02d" stroke-width="2"/>
  <text x="875" y="300" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CimModel</text>
  <text x="710" y="330" font-family="Arial" font-size="12">- objects_: unordered_map&lt;string, shared_ptr&lt;CimIdentifiedObject&gt;&gt;</text>
  <text x="710" y="345" font-family="Arial" font-size="12">- typeIndex_: unordered_map&lt;type_index, vector&lt;string&gt;&gt;</text>
  <text x="710" y="360" font-family="Arial" font-size="12">- modelId_: string</text>
  <text x="710" y="400" font-family="Arial" font-size="12">+ addObject&lt;T&gt;(object: shared_ptr&lt;T&gt;): bool</text>
  <text x="710" y="415" font-family="Arial" font-size="12">+ getObject&lt;T&gt;(id: string): shared_ptr&lt;T&gt;</text>
  <text x="710" y="430" font-family="Arial" font-size="12">+ getObjectsByType&lt;T&gt;(): vector&lt;shared_ptr&lt;T&gt;&gt;</text>
  <text x="710" y="445" font-family="Arial" font-size="12">+ resolveReferences(): bool</text>
  <text x="710" y="460" font-family="Arial" font-size="12">+ getObjectCount(): size_t</text>
  
  <!-- CimEquipment inheritance hierarchy -->
  <rect x="700" y="500" width="350" height="100" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="5" ry="5"/>
  <line x1="700" y1="530" x2="1050" y2="530" stroke="#d32f2f" stroke-width="2"/>
  <text x="875" y="520" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CimIdentifiedObject</text>
  <text x="710" y="550" font-family="Arial" font-size="12">- mRID_: string</text>
  <text x="710" y="565" font-family="Arial" font-size="12">- name_: string</text>
  <text x="710" y="580" font-family="Arial" font-size="12">+ getMRID(): string</text>
  <text x="710" y="595" font-family="Arial" font-size="12">+ getTypeName(): string [virtual]</text>
  
  <rect x="700" y="640" width="350" height="100" fill="#ffebee" stroke="#d32f2f" stroke-width="2" rx="5" ry="5"/>
  <line x1="700" y1="670" x2="1050" y2="670" stroke="#d32f2f" stroke-width="2"/>
  <text x="875" y="660" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CimEquipment</text>
  <text x="710" y="690" font-family="Arial" font-size="12">- inService_: bool</text>
  <text x="710" y="705" font-family="Arial" font-size="12">- normallyInService_: bool</text>
  <text x="710" y="720" font-family="Arial" font-size="12">+ isInService(): bool</text>
  <text x="710" y="735" font-family="Arial" font-size="12">+ setInService(inService: bool): void</text>
  
  <!-- Lines between classes -->
  <!-- Cim17Parser to XmlHandler -->
  <line x1="470" y1="150" x2="270" y2="280" stroke="#5c5c5c" stroke-width="1.5"/>
  <polygon points="266,275 262,285 274,285" fill="#5c5c5c"/>
  <text x="320" y="230" font-family="Arial" font-size="12" fill="#5c5c5c">uses</text>
  
  <!-- Cim17Parser to CimModel -->
  <line x1="730" y1="150" x2="820" y2="280" stroke="#5c5c5c" stroke-width="1.5"/>
  <polygon points="826,275 822,285 814,285" fill="#5c5c5c"/>
  <text x="780" y="230" font-family="Arial" font-size="12" fill="#5c5c5c">contains</text>
  
  <!-- Cim17Parser to CimRdfParser -->
  <path d="M 470 180 Q 300 200 225 500" stroke="#5c5c5c" stroke-width="1.5" fill="none"/>
  <polygon points="220,495 222,505 230,497" fill="#5c5c5c"/>
  <text x="320" y="320" font-family="Arial" font-size="12" fill="#5c5c5c">uses</text>
  
  <!-- CimRdfParser to CimModel -->
  <line x1="350" y1="550" x2="700" y2="400" stroke="#5c5c5c" stroke-width="1.5"/>
  <polygon points="695,398 697,408 705,395" fill="#5c5c5c"/>
  <text x="500" y="460" font-family="Arial" font-size="12" fill="#5c5c5c">populates</text>
  
  <!-- CimModel to CimIdentifiedObject -->
  <line x1="875" y1="460" x2="875" y2="500" stroke="#5c5c5c" stroke-width="1.5"/>
  <polygon points="880,495 870,495 875,505" fill="#5c5c5c"/>
  <text x="885" y="480" font-family="Arial" font-size="12" fill="#5c5c5c">contains</text>
  
  <!-- CimIdentifiedObject to CimEquipment -->
  <line x1="875" y1="600" x2="875" y2="640" stroke="#5c5c5c" stroke-width="1.5"/>
  <polygon points="880,635 870,635 875,645" fill="#5c5c5c"/>
  <text x="885" y="625" font-family="Arial" font-size="12" fill="#5c5c5c">inherits</text>
  
  <!-- Cim17Parser to CgmesProfile -->
  <path d="M 600 240 Q 600 350 600 500" stroke="#5c5c5c" stroke-width="1.5" fill="none"/>
  <polygon points="605,495 595,495 600,505" fill="#5c5c5c"/>
  <text x="610" y="350" font-family="Arial" font-size="12" fill="#5c5c5c">uses</text>
  
  <!-- Equipment hierarchy label -->
  <text x="950" y="780" font-family="Arial" font-size="14" font-style="italic">Specific equipment classes: ACLineSegment,</text>
  <text x="950" y="800" font-family="Arial" font-size="14" font-style="italic">PowerTransformer, SynchronousMachine, etc.</text>
  
  <!-- Legend -->
  <rect x="100" y="740" width="20" height="20" fill="#e1f5fe" stroke="#0288d1" stroke-width="2"/>
  <text x="130" y="755" font-family="Arial" font-size="12">Main Classes</text>
  
  <rect x="100" y="770" width="20" height="20" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="130" y="785" font-family="Arial" font-size="12">XML Processing</text>
  
  <rect x="100" y="800" width="20" height="20" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
  <text x="130" y="815" font-family="Arial" font-size="12">Model Storage</text>
  
  <rect x="250" y="740" width="20" height="20" fill="#ffecb3" stroke="#ffa000" stroke-width="2"/>
  <text x="280" y="755" font-family="Arial" font-size="12">Parsing Logic</text>
  
  <rect x="250" y="770" width="20" height="20" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="280" y="785" font-family="Arial" font-size="12">Utility/Enum</text>
  
  <rect x="250" y="800" width="20" height="20" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="280" y="815" font-family="Arial" font-size="12">Domain Models</text>
</svg>
